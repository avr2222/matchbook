name: Sync CricHeroes

on:
  schedule:
    # Every Sunday at 9 PM IST (3:30 PM UTC)
    - cron: '30 15 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-sync all matches (ignores already-synced)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run CricHeroes sync
        run: python scripts/sync_cricheroes.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
